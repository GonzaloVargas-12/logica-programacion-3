<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factorial de un número</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 0 16px;
      text-align: center;
      color: #222;
    }
    #resultado {
      margin: 24px 0;
      font-size: 1.4rem;
      word-break: break-all;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Factorial de un número</h1>
  <p id="resultado">Esperando un número…</p>
  <button id="calcular">Calcular otro número</button>
  <p><small>El resultado también se imprime en la consola (F12).</small></p>

  <script src="factorial.js"></script>
</body>
</html>
